<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Room</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

/* MAIN LAYOUT */

.container{
flex:1;
display:grid;
grid-template-columns:250px 1fr 300px;
}

/* LEFT PANEL */

.members{
background:#1e293b;
padding:20px;
border-right:1px solid #334155;
}

.members h3{
margin-bottom:20px;
}

.member{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.status{
width:10px;
height:10px;
border-radius:50%;
background:#22c55e;
}

.host{
font-size:12px;
color:#facc15;
margin-left:auto;
}

/* CHAT AREA */

.chat{
display:flex;
flex-direction:column;
}

.chat-header{
display:flex;
justify-content:flex-end;
gap:15px;
padding:15px;
border-bottom:1px solid #334155;
}

.icon{
cursor:pointer;
font-size:18px;
}

.messages{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
margin-bottom:15px;
}

.username{
font-weight:600;
margin-right:5px;
}

/* NOTES PANEL */

.notes{
background:#1e293b;
padding:20px;
border-left:1px solid #334155;
}

.notes textarea{
width:100%;
height:80px;
background:#0f172a;
color:white;
border:none;
padding:10px;
margin-top:10px;
}

.notes button{
margin-top:10px;
padding:8px 12px;
background:#22c55e;
border:none;
color:black;
cursor:pointer;
}

/* MESSAGE BAR */

.message-bar{
display:flex;
align-items:center;
gap:10px;
padding:15px;
border-top:1px solid #334155;
}

.message-bar input{
flex:1;
padding:10px;
background:#1e293b;
border:none;
color:white;
}

.send-btn{
background:#22c55e;
border:none;
padding:10px 15px;
cursor:pointer;
color:black;
}

.plus-btn{
font-size:20px;
cursor:pointer;
}

/* POPUP MENU */

.popup{
position:absolute;
bottom:70px;
left:20px;
background:#1e293b;
padding:10px;
border-radius:5px;
display:none;
}

.popup div{
padding:5px;
cursor:pointer;
}

.popup div:hover{
background:#334155;
}

.leave{
position:absolute;
top:15px;
right:20px;
background:#ef4444;
border:none;
padding:8px 12px;
cursor:pointer;
color:white;
}

</style>
</head>

<body>

<button class="leave" onclick="leaveRoom()">Leave Room</button>

<div class="container">

<!-- MEMBERS -->
<div class="members">

<h3>Active Members</h3>

<div id="memberList">

<div class="member">
<div class="status"></div>
<span id="hostName">Host</span>
<span class="host">HOST</span>
</div>

</div>

</div>

<!-- CHAT -->

<div class="chat">

<div class="chat-header">

<h2 id="roomTitle"></h2>

<span class="icon">🎤</span>
<span class="icon">📹</span>

</div>

<div class="messages" id="messages"></div>

</div>

<!-- NOTES -->

<div class="notes">

<h3>Public Notes</h3>

<textarea id="noteInput" placeholder="Write notes..."></textarea>

<button onclick="addNote()">Add Note</button>

<div id="notesList"></div>

</div>

</div>

<!-- MESSAGE BAR -->

<div class="message-bar">

<div class="plus-btn" onclick="toggleMenu()">+</div>

<input id="messageInput" placeholder="Feel free to talk">

<button class="send-btn" onclick="sendMessage()">Send</button>

</div>

<div class="popup" id="popupMenu">

<div>Start Voice Chat 🎤</div>
<div>Start Video Chat 📹</div>

</div>

<script>

/* GET USER NAME */

const username = localStorage.getItem("username") || "User";

document.getElementById("hostName").innerText = username;

/* SEND MESSAGE */

function sendMessage(){

const input=document.getElementById("messageInput");
const message=input.value;

if(message==="") return;

const chat=document.getElementById("messages");

const msg=document.createElement("div");
msg.className="message";

msg.innerHTML="<span class='username'>"+username+":</span>"+message;

chat.appendChild(msg);

input.value="";

chat.scrollTop=chat.scrollHeight;

}

/* ENTER KEY SEND */

document.getElementById("messageInput").addEventListener("keypress",function(e){

if(e.key==="Enter") sendMessage();

});

/* NOTES */

function addNote(){

const note=document.getElementById("noteInput").value;

if(note==="") return;

const list=document.getElementById("notesList");

const div=document.createElement("div");

div.innerText="• "+note;

list.appendChild(div);

document.getElementById("noteInput").value="";

}

/* POPUP MENU */

function toggleMenu(){

const menu=document.getElementById("popupMenu");

menu.style.display = menu.style.display==="block" ? "none" : "block";

}

/* LEAVE ROOM */

function leaveRoom(){

const save=confirm("Do you want to save this room in dashboard?");

window.location.href="dashboard.html";

}

</script>
<script>
const params = new URLSearchParams(window.location.search);
const roomId = params.get("roomId");

async function loadRoom() {
  if (!roomId) {
    console.log("No roomId found");
    return;
  }

  try {
    const res = await fetch(`http://localhost:5000/api/rooms/${roomId}`);

    if (!res.ok) throw new Error("Failed to fetch room");

    const room = await res.json();

    console.log("ROOM DATA:", room); // 👈 debug

    if (room && room.lobbyName) {
      document.getElementById("roomTitle").innerText = room.lobbyName;
    } else {
      document.getElementById("roomTitle").innerText = "Room";
    }

  } catch (err) {
    console.error(err);
    document.getElementById("roomTitle").innerText = "Error loading room";
  }
}

loadRoom();
</script>
</body>
</html>
