<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-box">
        <h2>Sign Up</h2>

        <form onsubmit="return validatePassword()">
            <input type="text" placeholder="Username" required>
            <input type="email" placeholder="Email" required>

            <div class="password-box">
                <input type="password" id="password" placeholder="Password" required>
                <span onclick="togglePassword('password', this)">
                    <i class="fa-solid fa-eye-slash"></i>
                </span>
            </div>

            <div class="password-box">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <span onclick="togglePassword('confirmPassword', this)">
                    <i class="fa-solid fa-eye-slash"></i>
                </span>
            </div>

            <p id="error-msg"></p>

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  createUserWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyApwG4IG7-kUfWY6iaEYfUyU7r6yCOQEW0",
  authDomain: "study2gether-8620d.firebaseapp.com",
  projectId: "study2gether-8620d",
  storageBucket: "study2gether-8620d.firebasestorage.app",
  messagingSenderId: "650164926871",
  appId: "1:650164926871:web:a960df09e36f6472a8acd2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.querySelector("form");

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const email = document.querySelector('input[type="email"]').value;
  const password = document.getElementById("password").value;
  const confirmPass = document.getElementById("confirmPassword").value;

  if (password !== confirmPass) {
    alert("Passwords do not match");
    return;
  }

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Account created successfully 🎉");
     window.location.href = "profile-setup.html";
    })
    .catch((error) => {
      alert(error.message);
    });
});
</script>

</body>
</html>
